<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fraction Lab">
<meta name="theme-color" content="#141312">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<title>Mio's Fraction Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141312;--surface:#1d1b19;--surface2:#2a2724;--line:#3d3833;
  --ink:#f2efe9;--muted:#a8a29a;
  --orange:#f0a457;--teal:#3fbdbd;--purple:#c98ab8;--red:#ff7a8f;--on-accent:#141312;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#141312;--surface:#1d1b19;--surface2:#2a2724;--line:#3d3833;
  --ink:#f2efe9;--muted:#a8a29a;
  --orange:#f0a457;--teal:#3fbdbd;--purple:#c98ab8;--red:#ff7a8f;--on-accent:#141312;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#faf8f4;--surface:#ffffff;--surface2:#ece6dc;--line:#d3c9ba;
    --ink:#1c1917;--muted:#57534e;
    --orange:#c2661a;--teal:#0f5e5e;--purple:#7a3b6b;--red:#a3172e;--on-accent:#ffffff;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#faf8f4;--surface:#ffffff;--surface2:#ece6dc;--line:#d3c9ba;
  --ink:#1c1917;--muted:#57534e;
  --orange:#c2661a;--teal:#0f5e5e;--purple:#7a3b6b;--red:#a3172e;--on-accent:#ffffff;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:20px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
main{max-width:780px;margin:0 auto;padding:20px 22px 56px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
p{margin:0 0 12px}
.muted{color:var(--muted)}

/* type */
.title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:clamp(46px,9vw,76px);line-height:.95;margin:18px 0 6px;letter-spacing:-.01em}
.sub{font-size:22px;color:var(--muted);margin:0 0 28px}
.h2{font-size:24px;font-weight:700;margin:28px 0 8px}
.q{font-size:26px;font-weight:700;margin:6px 0 18px;line-height:1.35}
.kicker{color:var(--muted);font-size:17px;margin:4px 0 0}

/* fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;line-height:1.08;vertical-align:middle;font-variant-numeric:tabular-nums;margin:0 .08em}
.frac>span{padding:0 .16em;min-width:1.1em;text-align:center}
.frac .d{border-top:.075em solid currentColor}
.big{font-size:clamp(46px,9vw,64px)}
.mid{font-size:30px}
.sm{font-size:22px}
.numin{width:2.3em;font:inherit;font-weight:700;text-align:center;background:var(--surface2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:0;margin:2px 0;-moz-appearance:textfield}
.numin:focus{border-color:var(--teal);outline:none}
.numin.wide{width:3.2em}
.inline-in{font-size:26px;vertical-align:middle}

/* buttons */
.btn{min-height:60px;padding:12px 26px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:20px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:6px 16px;font-size:17px}
.btn:disabled{opacity:.38;cursor:default}
.btn.wide{width:100%}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.actions .btn.primary{flex:1 1 240px}
.iconbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:22px;display:grid;place-items:center;flex:none}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.prog{flex:1;display:flex;gap:6px;list-style:none;margin:0;padding:0}
.prog li{flex:1;height:12px;border-radius:6px;background:var(--surface2)}
.prog li.done{background:var(--teal)}
.prog li.miss{background:var(--purple)}
.prog li.now{background:var(--orange)}
.leave{font-size:15px;font-weight:700;width:auto;padding:0 14px;border-radius:28px}

/* ask */
.cmp{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,26px);flex-wrap:wrap;margin:10px 0 22px}
.slot{min-width:1.3em;height:1.3em;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--orange);font-weight:700}
.slot.filled{border-style:solid;border-color:var(--orange)}
.vs{color:var(--muted);font-weight:500;font-size:.6em}
.whole{font-weight:700}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.choice{min-width:96px;min-height:80px;padding:8px 22px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:24px}
.choice.sym{font-size:44px;line-height:1}
.choice[aria-pressed="true"]{border-color:var(--orange);background:var(--surface2);color:var(--orange)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{min-height:120px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile[aria-pressed="true"]{border-color:var(--orange);background:var(--surface2)}
.tile .nm{font-size:19px;font-weight:700}
.story{font-size:22px;margin-bottom:6px}
.lines{list-style:none;padding:0;margin:0 0 6px;font-size:22px}
.lines li{margin:6px 0}

/* hint */
.hintrow{display:flex;justify-content:center;margin-top:22px}
.hintbox:not(:empty){margin-top:16px;padding:16px 18px;border-left:4px solid var(--teal);background:var(--surface)}
.bars{width:100%;height:auto;display:block;margin:10px 0}
.seg{fill:var(--surface2);stroke:var(--bg);stroke-width:1.5}
.seg.thin{stroke-width:.35}
.seg.on.c0{fill:var(--orange)}.seg.on.c1{fill:var(--teal)}.seg.on.c2{fill:var(--purple)}
.wholebox{fill:none;stroke:var(--muted);stroke-width:1.5}
.bl{fill:var(--ink);font:700 18px "DM Sans",system-ui,sans-serif}
.mk{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}
.mkl{fill:var(--ink);font:700 16px "DM Sans",system-ui,sans-serif}

/* explain */
.explain{margin-top:30px;padding-top:6px;border-top:2px solid var(--line)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.chip{text-align:left;min-height:64px;padding:12px 16px 12px 54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);position:relative}
.chip::before{content:"";position:absolute;left:16px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:7px;border:2px solid var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--teal)}
.chip[aria-pressed="true"]::before{background:var(--teal);border-color:var(--teal)}
.chip[aria-pressed="true"]::after{content:"";position:absolute;left:24px;top:50%;width:7px;height:13px;margin-top:-9px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg)}
.cl{display:block;font-weight:700;font-size:19px;line-height:1.3}
.cs{display:block;color:var(--muted);font-size:16px;line-height:1.3;margin-top:2px}
.work{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.work p{font-weight:700}
.wrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0;font-size:24px}
.wrow .nm{font-size:18px;font-weight:700;min-width:5.5em}
.padwrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pad{width:100%;height:300px;border-radius:14px;background:var(--bg);border:2px dashed var(--line);touch-action:none;display:block}
.locked .pad{pointer-events:none}

/* feedback */
.fb{margin-top:28px;padding:20px 22px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.fb.good{border-color:var(--teal)}
.fb.try{border-color:var(--purple)}
.fbhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fbhead h2{margin:0;font-size:30px}
.fb.good h2{color:var(--teal)}
.fb.try h2{color:var(--purple)}
.stars{font-size:34px;color:var(--orange);letter-spacing:4px}
.stars .off{color:var(--line)}
.pline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.pn{font-weight:700;min-width:5.5em}
.op{color:var(--muted);font-size:26px}
.ok{color:var(--teal);font-weight:700}
.no{color:var(--red);font-weight:700}
.note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
}

/* home */
.mission{padding:22px;border-radius:22px;background:var(--surface);border:2px solid var(--line)}
.mission h2{margin:0 0 10px;font-size:26px}
.checklist{list-style:none;padding:0;margin:0 0 20px}
.checklist li{display:flex;align-items:center;gap:16px;padding:10px 0;font-size:20px;position:relative}
.checklist li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:-12px;border-left:4px dotted var(--line)}
/* mile-marker signposts */
.mm{position:relative;flex:none;width:46px;height:44px;display:block}
.mm .plate{position:absolute;left:0;top:0;width:46px;height:32px;border-radius:7px;background:#006b3f;border:2px solid #ffffff;box-shadow:0 0 0 2px #006b3f;display:flex;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:16px;color:#ffffff;line-height:1;z-index:1}
.mm .plate svg{width:15px;height:15px;flex:none}
.mm::after{content:"";position:absolute;left:20px;top:32px;width:6px;height:14px;background:#8a8f94}
.checklist li.ok .plate{background:#008a50;box-shadow:0 0 0 2px #008a50,0 0 0 5px #ffd36e}
.checklist li.no .plate{opacity:.55}
.checklist li.fin{color:var(--muted);font-weight:700}
.mm.flag .plate{background:transparent;border:0;font-size:26px}
.mm.flag::after{display:none}
.checklist .st{margin-left:auto;color:var(--orange);letter-spacing:2px}
/* page-load joy */
.herowrap{position:relative;flex:none}
.spark{position:absolute;left:50%;top:50%;width:16px;height:16px;background:#ffd36e;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;pointer-events:none}
.spark.pk{background:#ffb7c9}.spark.tl{background:#9fe0dd}
@media (prefers-reduced-motion:no-preference){
  .homehero .ch{animation:heroIn .8s cubic-bezier(.3,1.6,.5,1) both,wiggle 1s ease-in-out .85s 1}
  @keyframes heroIn{0%{transform:translateY(-50px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
  .spark{animation:spark 1s ease-out .55s both}
  @keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(120deg)}}
  .homehero .title,.homehero .sub{animation:riseIn .6s ease-out both}
  .homehero .sub{animation-delay:.15s}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .trail li{animation:mmIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.7s + var(--i) * .1s)}
  @keyframes mmIn{from{opacity:0;transform:translateY(-12px) scale(.9)}to{opacity:1;transform:none}}
}
.record{font-size:20px;margin:22px 0 0}
.record b{color:var(--orange)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pgrid .btn{text-align:left;font-size:18px}
.homefoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:36px}
.hold{position:relative;overflow:hidden;min-height:48px;padding:8px 18px;border-radius:24px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:16px}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--teal)}
.hold.holding::after{width:100%;transition:width 1.2s linear}
.toggle{min-height:48px;padding:8px 18px;border-radius:24px;border:2px solid var(--line);background:transparent;font-size:16px}

/* end */
.bigstars{font-family:"Cormorant Garamond",Georgia,serif;font-size:120px;font-weight:700;line-height:1;margin:10px 0;color:var(--orange)}
.bigstars span{font-family:"DM Sans",system-ui,sans-serif;font-size:24px;color:var(--ink);font-weight:500;margin-left:10px}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;background:var(--orange);color:var(--on-accent);font-weight:700}

/* grown-ups */
.gtitle{font-size:28px;margin:0;flex:1}
.tablewrap{overflow-x:auto}
.gt{border-collapse:collapse;width:100%;font-size:17px;min-width:480px}
.gt th,.gt td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.gt th{color:var(--muted);font-weight:500}
.watch{padding-left:22px}
.watch li{margin:6px 0}
.log{display:flex;flex-direction:column;gap:12px}
.entry{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:17px}
.entry .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.entry .meta{color:var(--muted)}
.entry img{max-width:240px;width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
/* kawaii characters */
.ch{display:block}
.chwrap{display:block}
.guide{display:flex;align-items:flex-end;gap:14px;margin:10px 0 16px}
.guide .ch{width:88px;height:88px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 18px;font-weight:700;font-size:19px;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.homehero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.homehero .ch{width:132px;height:132px;flex:none}
.homehero .title{margin-top:0}
.tile .ch{width:76px;height:76px}
.fbhead .ch{width:92px;height:92px}
.friends{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.friend{text-align:center;padding:12px 8px;border-radius:20px;background:var(--surface);border:2px solid var(--line);font-size:16px;font-weight:700}
.friend .ch{width:78px;height:78px;margin:0 auto 6px}
.friend.locked .ch{filter:grayscale(1) brightness(.4);opacity:.55}
.friend.locked{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:no-preference){
  .bounce{animation:bounce .9s cubic-bezier(.3,1.8,.5,1) 1;transform-origin:50% 100%}
  @keyframes bounce{0%{transform:none}30%{transform:translateY(-14px) scale(1.06,.94)}60%{transform:scale(.96,1.04)}100%{transform:none}}
}
.tag{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:12px;background:var(--surface2);color:var(--orange);font-size:14px;font-weight:700;vertical-align:middle}
.lvlup{margin-top:14px}
.stage{font-weight:700}.stage.s0{color:var(--purple)}.stage.s1{color:var(--orange)}.stage.s2{color:var(--teal)}.stage.s3{color:var(--ink)}
/* step-by-step */
.steps{margin-top:24px}
.steplist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.step .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);color:var(--muted)}
.step.now{border-color:var(--orange);padding:16px}
.step.now .num{background:var(--orange);color:var(--on-accent)}
.step.done .num{background:var(--teal);color:var(--on-accent)}
.step.later{opacity:.5}
.stt{font-weight:700;font-size:20px;line-height:1.3;padding-top:5px}
.sum{color:var(--muted);font-size:17px}
.sbody{flex:1;min-width:0}
.sp{margin:6px 0 12px}
.schoices{display:flex;flex-wrap:wrap;gap:10px}
.schoice{min-height:56px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-size:18px;text-align:left}
.schoice.wrong{border-color:var(--red);color:var(--red)}
.schoice[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.schoice.none{min-height:44px;font-size:16px;margin-left:6px}
.snote:not(:empty){margin:12px 0 0;color:var(--purple);font-weight:700}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:24px}
.srow .nm{font-size:17px;font-weight:700;min-width:4.5em}
.srow .op{font-size:24px}
.sgo{margin-top:6px}
.waiting .cards,.waiting .choices{opacity:.55;pointer-events:none}
/* scene cards + models */
.story{font-size:22px;line-height:1.55;margin:4px 0 10px}
.story .frac{font-size:21px}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin:10px 0 18px}
.card{min-width:148px;padding:12px 14px 14px;border-radius:22px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.card .ch{width:84px;height:84px}
.card .nm{font-size:19px;font-weight:700}
.card .mid{font-size:32px}
.card[aria-pressed="true"]{border-color:var(--orange);background:var(--surface2)}
.card.hero{border-color:var(--teal)}
.chslot{display:block}
.eqrow>.op{font-size:44px;color:var(--muted)}
.axis{stroke:var(--muted);stroke-width:2}
.trk{stroke-width:9;stroke-linecap:round}
.trk.c0{stroke:var(--orange)}.trk.c1{stroke:var(--teal)}.trk.c2{stroke:var(--purple)}
.tick{stroke:var(--muted);stroke-width:1.5}.tick.big{stroke:var(--ink);stroke-width:2.5}
.tl{fill:var(--muted);font:500 15px "DM Sans",system-ui,sans-serif}
.dot{stroke:var(--bg);stroke-width:3}.dot.c0{fill:var(--orange)}.dot.c1{fill:var(--teal)}.dot.c2{fill:var(--purple)}
.cupsvg{margin-left:auto;margin-right:auto}
/* compact one-screen home */
main.home{max-width:1040px;padding-top:14px;padding-bottom:20px}
.home .homehero{gap:14px;margin-bottom:14px}
.home .homehero .ch{width:92px;height:92px}
.home .homehero .title{font-size:clamp(36px,5.5vw,54px);margin:0}
.home .homehero .sub{font-size:18px;margin:4px 0 0}
.homegrid{display:grid;gap:14px}
@media (min-width:700px){.homegrid{grid-template-columns:1.05fr 1fr;align-items:stretch}}
.home .mission{padding:14px 18px;display:flex;flex-direction:column}
.home .mission h2{font-size:22px;margin:0 0 2px}
.home .mission .checklist{margin:0 0 10px}
.home .trail li{padding:4px 0;font-size:18px;gap:14px}
.home .trail .mm{height:38px}
.home .trail .mm .plate{height:28px;font-size:15px}
.home .trail .mm::after{top:28px;height:10px}
.home .trail li:not(:last-child)::before{top:40px;bottom:-6px}
.home .mission .btn.wide{min-height:54px;margin-top:auto}
.home .record{font-size:16px;margin:8px 0 0}
.homeside{display:flex;flex-direction:column;gap:14px}
.panel{padding:14px 16px;border-radius:22px;background:var(--surface);border:2px solid var(--line)}

<body>
<main id="app"></main>
<script>
(function(){
"use strict";
const KEY='fractionlab.v1';
const SKILLS={
  compare:{name:'Compare two fractions'},
  benchmark:{name:'Compare to ½ or 1'},
  missing:{name:'Fill in the missing number'},
  equiv:{name:'Same size or not?'},
  findtwo:{name:'Make equivalent fractions'},
  story:{name:'Story problem'}
};
const MISSION=['compare','benchmark','missing','equiv','findtwo','story'];
const STRAT_NAMES={samebottom:'Same bottom number',sametop:'Same top number',common:'Made the bottoms match',half:'Compared to ½',whole:'Compared to 1 whole',draw:'Drew it',halfof:'Found half of the bottom',wholeis:'What makes 1 whole',times:'Multiplied top and bottom',divide:'Divided top and bottom',bars:'Pictured the bars'};

/* ---------- kawaii cast (original characters) ---------- */
const INK='#3b2b2b',BLUSH='#ff9fb4';
function face(cx,cy,mood,s){s=s||1;const ex=14*s;let eyes,mouth;
  if(mood==='happy'||mood==='cheer'){
    eyes=[-ex,ex].map(o=>`<path d="M${cx+o-5*s} ${cy+2*s} q${5*s} ${-8*s} ${10*s} 0" fill="none" stroke="${INK}" stroke-width="${3.2*s}" stroke-linecap="round"/>`).join('');
    mouth=`<path d="M${cx-6*s} ${cy+9*s} q${6*s} ${9*s} ${12*s} 0 z" fill="#ff6f8f" stroke="${INK}" stroke-width="${2.4*s}" stroke-linejoin="round"/>`;
  }else{
    const up=mood==='think'?-2*s:0;
    eyes=[-ex,ex].map(o=>`<ellipse cx="${cx+o}" cy="${cy+up}" rx="${4.6*s}" ry="${5.6*s}" fill="${INK}"/><circle cx="${cx+o+1.6*s}" cy="${cy+up-2*s}" r="${1.7*s}" fill="#fff"/>`).join('');
    mouth=mood==='think'?`<ellipse cx="${cx}" cy="${cy+11*s}" rx="${3*s}" ry="${3.4*s}" fill="none" stroke="${INK}" stroke-width="${2.4*s}"/>`:`<path d="M${cx-7*s} ${cy+8*s} q${3.5*s} ${4*s} ${7*s} 0 q${3.5*s} ${4*s} ${7*s} 0" fill="none" stroke="${INK}" stroke-width="${2.6*s}" stroke-linecap="round"/>`;
  }
  const blush=[-ex-6*s,ex+6*s].map(o=>`<ellipse cx="${cx+o}" cy="${cy+7*s}" rx="${5.5*s}" ry="${3.3*s}" fill="${BLUSH}" opacity=".85"/>`).join('');
  return blush+eyes+mouth;}
function extras(mood){
  if(mood==='cheer')return `<g fill="#ffd36e" stroke="${INK}" stroke-width="1.5">${[[13,22,1],[105,16,.8],[109,76,.7]].map(([x,y,k])=>`<path transform="translate(${x} ${y}) scale(${k})" d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6Z"/>`).join('')}</g>`;
  if(mood==='think')return `<path d="M102 24 q8 12 0 16 q-8 -4 0 -16z" fill="#9fd3ff" stroke="${INK}" stroke-width="2"/>`;
  return '';}
const O=`stroke="${INK}" stroke-width="3" stroke-linejoin="round"`;
const CAST={
  mochi:{name:'Mochi',at:0,line:'I am a mochi, and I love halves!',draw:m=>`
    <path d="M60 22 q-6 -12 -16 -9 q4 9 16 9z M60 22 q6 -12 16 -9 q-4 9 -16 9z" fill="#ffb7c9" ${O}/>
    <path d="M16 78 C16 44 36 24 60 24 C84 24 104 44 104 78 C104 96 86 104 60 104 C34 104 16 96 16 78Z" fill="#fff6f1" ${O}/>
    <path d="M60 25.5 C83 26 102.5 45 102.5 78 C102.5 95 85 102.5 60 102.5Z" fill="#ffd9e2"/>
    <path d="M60 26 L60 102" stroke="${INK}" stroke-width="2" stroke-dasharray="4 5" opacity=".3"/>
    ${face(60,70,m)}`},
  kelp:{name:'Kelp the otter',at:0,line:'I swim in the kelp forest!',draw:m=>`
    <circle cx="22" cy="50" r="8" fill="#a9774f" ${O}/><circle cx="98" cy="50" r="8" fill="#a9774f" ${O}/>
    <ellipse cx="60" cy="66" rx="44" ry="40" fill="#b98a63" ${O}/>
    <ellipse cx="60" cy="76" rx="29" ry="23" fill="#f3e2cc"/>
    ${face(60,58,m)}
    <ellipse cx="60" cy="63" rx="4.5" ry="3.2" fill="${INK}"/>
    <path d="M27 78 h-12 M27 85 h-11 M93 78 h12 M93 85 h11" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`},
  bolt:{name:'Bolt the robot',at:10,line:'Beep boop! Let us test it.',draw:m=>`
    <line x1="60" y1="22" x2="60" y2="10" stroke="${INK}" stroke-width="3"/><circle cx="60" cy="9" r="6" fill="#f0a457" ${O}/>
    <rect x="8" y="52" width="12" height="22" rx="5" fill="#7cc4c4" ${O}/><rect x="100" y="52" width="12" height="22" rx="5" fill="#7cc4c4" ${O}/>
    <rect x="18" y="22" width="84" height="80" rx="26" fill="#a8e0de" ${O}/>
    <rect x="28" y="36" width="64" height="52" rx="18" fill="#eafaf8" ${O}/>
    ${face(60,58,m,.95)}`},
  hazel:{name:'Hazel the squirrel',at:25,line:'I save my acorns in fractions!',draw:m=>`
    <path d="M84 104 C120 98 122 50 100 38 C88 32 78 46 90 56 C100 66 96 84 78 92Z" fill="#e3a06a" ${O}/>
    <path d="M28 36 L24 12 L44 28Z M88 36 L92 12 L72 28Z" fill="#d98f5c" ${O}/>
    <ellipse cx="58" cy="66" rx="40" ry="38" fill="#d98f5c" ${O}/>
    <ellipse cx="58" cy="76" rx="25" ry="21" fill="#fbe5cf"/>
    ${face(58,58,m,.95)}
    <ellipse cx="58" cy="63" rx="3.6" ry="2.7" fill="${INK}"/>`},
  rio:{name:'Rio the hawk',at:45,line:'I can spot fractions from the sky!',draw:m=>`
    <path d="M54 26 q2 -16 12 -14 q-2 7 -5 14z" fill="#a8613a" ${O}/>
    <path d="M20 68 q-12 10 -6 26 q13 -2 17 -15z M100 68 q12 10 6 26 q-13 -2 -17 -15z" fill="#a8613a" ${O}/>
    <ellipse cx="60" cy="66" rx="42" ry="42" fill="#c97b4a" ${O}/>
    <ellipse cx="60" cy="84" rx="26" ry="20" fill="#fbead6"/>
    ${face(60,56,m,.95)}
    <path d="M55 60 L65 60 L60 67Z" fill="#ffc24a" ${O}/>`},
  dart:{name:'Dart the paper plane',at:70,line:'Whoosh! I fly the farthest.',draw:m=>`
    <path d="M6 66 L114 26 L60 108 L52 80Z" fill="#ffffff" ${O}/>
    <path d="M52 80 L114 26 L42 70Z" fill="#dcd6ff" ${O}/>
    ${face(74,78,m,.62)}`}
};
function ch(id,mood,cls){const c=CAST[id];return `<svg class="ch ${cls||''}" viewBox="0 0 120 120" role="img" aria-label="${c.name}">${c.draw(mood||'normal')}${extras(mood)}</svg>`}
const totalStars=()=>S.totalStars||0;
const unlocked=()=>Object.keys(CAST).filter(k=>CAST[k].at<=totalStars());
const ARROW='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v13M4.5 10l5.5 5.5 5.5-5.5" fill="none" stroke="#5fbf8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECKI='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEERS=['Yay! You got it!','Sugoi! That’s right!','Fraction power!','You’re on fire!','Nailed it!'];

/* ---------- state ---------- */
function freshState(){return{levels:{compare:1,benchmark:1,missing:1,equiv:1,findtwo:1,story:1},runs:{},history:[],steps:true,stepMode:'auto',mastery:{},days:{},stageLog:[],best:0,missions:0,streak:0,totalStars:0,lastDay:null,autoRead:true}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const s=freshState();Object.assign(s,o);s.levels=Object.assign(freshState().levels,o.levels||{});if(o.stepMode==null)s.stepMode=o.steps===false?'off':'auto';if(o.totalStars==null)s.totalStars=(s.history||[]).reduce((t,h)=>t+(h.correct?1:0)+(h.expl?1:0),0);return s}}catch(e){}return freshState()}
let S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function save(){
  if(S.history.length>60)S.history=S.history.slice(-60);
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){try{S.history.forEach((h,i)=>{if(i<S.history.length-10)h.drawing=null});localStorage.setItem(KEY,JSON.stringify(S))}catch(e2){}}
}

/* ---------- math helpers ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d)=>({n,d});
const txt=f=>f.n+'/'+f.d;
const eq=(a,b)=>a.n*b.d===b.n*a.d;
function cmpSym(a,b){const x=a.n*b.d,y=b.n*a.d;return x>y?'>':x<y?'<':'='}
const symWord=s=>({'>':'greater than','<':'less than','=':'equal to'})[s];
const DENS=[2,3,4,5,6,8,10,12];
const NAMES={2:['half','halves'],3:['third','thirds'],4:['fourth','fourths'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths'],12:['twelfth','twelfths'],16:['sixteenth','sixteenths'],20:['twentieth','twentieths'],24:['twenty-fourth','twenty-fourths'],25:['twenty-fifth','twenty-fifths'],100:['hundredth','hundredths']};
function spoken(f){if(f.d===1)return f.n===1?'one whole':f.n+' wholes';const nm=NAMES[f.d];return nm?`${f.n===1?'one':f.n} ${f.n===1?nm[0]:nm[1]}`:`${f.n} over ${f.d}`}
function fr(f,cls){return `<span class="frac ${cls||''}" aria-label="${spoken(f)}"><span class="n">${f.n}</span><span class="d">${f.d}</span></span>`}
function parseNum(s){s=String(s||'').trim();if(!s)return null;let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+ +m[2]/ +m[3];m=s.match(/^(\d+)\/(\d+)$/);if(m)return +m[1]/ +m[2];const v=parseFloat(s);return isNaN(v)?null:v}
const valN=id=>{const el=document.getElementById(id);return el?parseNum(el.value):null};
const intIn=(id,cls)=>`<input class="numin ${cls||''}" id="${id}" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="number">`;
const decIn=(id)=>`<input class="numin wide" id="${id}" inputmode="decimal" autocomplete="off" aria-label="number">`;

/* ---------- speech ---------- */
/* Read-aloud. iPad Safari drops an utterance queued right after cancel(), and
   long utterances can stall, so speech is split into sentences, kept referenced,
   and restarted after a short pause when something is already playing. */
const canSpeak=()=>typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
let sayVoice=null,sayTok=0,sayLive=[];
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Deranged|Hysterical|Pipe|Princess/i;
const ROBOTY=/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley/i;
function voiceScore(v){let s=0;if(/premium/i.test(v.name))s+=100;if(/enhanced/i.test(v.name))s+=60;if(/^en[-_]US/i.test(v.lang))s+=20;else if(/^en/i.test(v.lang))s+=10;else s-=200;if(/Ava|Zoe|Samantha|Allison|Evan|Nathan|Joelle|Noelle|Susan|Tom|Google US/i.test(v.name))s+=15;if(NOVELTY.test(v.name))s-=150;if(ROBOTY.test(v.name))s-=40;return s}
function englishVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>voiceScore(b)-voiceScore(a))}catch(e){return[]}}
function pickVoice(){const vs=englishVoices();sayVoice=(S.voiceName&&vs.find(v=>v.name===S.voiceName))||vs[0]||null}
if(canSpeak()){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function setSpeaking(on){const b=document.getElementById('readbtn');if(!b)return;b.textContent=on?'⏹':'🔊';b.setAttribute('aria-label',on?'Stop reading':'Read it to me')}
function stopSpeaking(){sayTok++;try{speechSynthesis.cancel()}catch(e){}sayLive=[];setSpeaking(false)}
function speak(t,force){
  if(!force&&!S.autoRead)return;
  if(!canSpeak())return;
  const text=String(t).replace(/½/g,'one half').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/(\d+)¢/g,'$1 cents').replace(/[“”⬆]/g,'').replace(/\s+/g,' ').trim();
  if(!text)return;
  const parts=(text.match(/[^.!?]+[.!?]*/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const tok=++sayTok;
  const go=()=>{
    if(tok!==sayTok)return;
    sayLive=[];
    parts.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);u.rate=S.rate||.92;u.pitch=1;u.lang=sayVoice?sayVoice.lang:'en-US';if(sayVoice)u.voice=sayVoice;
      if(i===0)u.onstart=()=>{if(tok===sayTok)setSpeaking(true)};
      u.onend=u.onerror=()=>{sayLive=sayLive.filter(x=>x!==u);if(i===parts.length-1&&tok===sayTok)setSpeaking(false)};
      sayLive.push(u);speechSynthesis.speak(u);
    });
    try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){}
  };
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,150)}
    else go();
  }catch(e){}
}

/* ---------- generators ---------- */
function genCompare(L){
  let a,b;
  if(L===1){
    if(Math.random()<.5){const d=pick([3,4,5,6,8,10,12]);const n1=ri(1,d-1);let n2;do{n2=ri(1,d-1)}while(n2===n1);a=F(n1,d);b=F(n2,d)}
    else{const n=ri(1,3);const ds=DENS.filter(d=>d>n);const d1=pick(ds);let d2;do{d2=pick(ds)}while(d2===d1);a=F(n,d1);b=F(n,d2)}
  }else if(L===2){
    const [p,q]=pick([[2,4],[2,8],[4,8],[3,6],[3,12],[4,12],[6,12],[5,10],[2,10],[10,100],[2,6],[4,100]]);
    const k=q/p,n1=ri(1,p-1);let n2;
    if(Math.random()<.2)n2=n1*k;
    else if(q===100)n2=Math.max(1,Math.min(99,n1*k+pick([-9,-5,-1,1,4,9])));
    else{do{n2=ri(1,q-1)}while(n2===n1*k)}
    a=F(n1,p);b=F(n2,q);
  }else{
    const r=Math.random();
    if(r<.6){const [p,q]=pick([[3,4],[4,6],[6,8],[3,8],[5,6],[4,10],[8,12],[3,10],[6,10],[10,12],[4,5],[2,5]]);do{a=F(ri(1,p-1),p);b=F(ri(1,q-1),q)}while(eq(a,b))}
    else if(r<.8){const p=pick([2,3,4]);const q=p*2;a=F(ri(p+1,2*p),p);do{b=F(ri(q+1,2*q),q)}while(eq(a,b))}
    else{a=F(ri(11,19),10);b=F(ri(5,95),100)}
  }
  if(Math.random()<.5)[a,b]=[b,a];
  return{type:'compare',skill:'compare',a,b,answer:cmpSym(a,b)};
}
function genBenchmark(L){
  const half=F(1,2),one=F(1,1);let t,a;
  if(L===1){t=one;const d=pick([3,4,5,6,8,10,12]);a=F(pick([d-1,d+1,d+ri(1,d-1),Math.max(1,ri(1,d-2))]),d)}
  else if(L===2){t=half;const d=pick([4,6,8,10,12,100]);const h=d/2;let n;
    if(Math.random()<.15)n=h;else if(d===100)n=h+pick([-30,-12,-3,2,8,25]);else n=pick([h-1,h+1,ri(1,d-1)]);
    a=F(Math.max(1,n),d)}
  else{if(Math.random()<.5){t=half;const d=pick([3,5]);a=F(ri(1,d-1),d)}else{t=one;const d=pick([12,100,10]);a=F(d+pick([-1,1,-3,3]),d)}}
  const s=cmpSym(a,t);
  return{type:'benchmark',skill:'benchmark',a,t,answer:s==='>'?'greater':s==='<'?'less':'equal'};
}
function genMissing(L){
  const d=pick([2,3,4,5,6]);let n=ri(1,d-1);
  if(L===3&&Math.random()<.4)n=ri(d+1,2*d);
  const k=L===1?2:ri(2,L===2?5:6);
  const small=F(n,d),big=F(n*k,d*k);
  let left,right,missing;
  if(L===3&&Math.random()<.35){left=big;right=F(small.n,small.d);missing='n'}
  else{left=small;right=F(big.n,big.d);missing=(L>=2&&Math.random()<.3)?'d':'n'}
  return{type:'missing',skill:'missing',left,right,missing,answer:right[missing]};
}
function genEquiv(L){
  const base=L===1?pick([F(1,2),F(1,3),F(2,3),F(1,4),F(3,4),F(2,5)]):L===2?pick([F(3,8),F(5,6),F(3,4),F(2,5),F(4,5),F(3,10)]):pick([F(9,4),F(5,3),F(7,4),F(5,2),F(11,5),F(7,6)]);
  const opts=[],used=new Set([txt(base)]);
  const add=(f,tag)=>{const k=txt(f);if(used.has(k)||f.n<=0||f.d<=0)return;used.add(k);opts.push({f,ok:eq(f,base),tag})};
  const ks=shuffle([2,3,4,5]);
  add(F(base.n*ks[0],base.d*ks[0]),'times');
  if(Math.random()<.5)add(F(base.n*ks[1],base.d*ks[1]),'times');
  let guard=0;
  while(opts.length<4&&guard++<80){
    const r=Math.random(),j=ri(1,4);let f,tag='other';
    if(r<.4){f=F(base.n+j,base.d+j);tag='additive'}
    else if(r<.7){const k=ri(2,4);f=F(base.n*k,base.d*k+pick([-2,-1,1,2]))}
    else{const k=ri(2,4);f=F(base.n*k+pick([-1,1]),base.d*k)}
    if(eq(f,base))continue;
    add(f,tag);
  }
  return{type:'equiv',skill:'equiv',base,opts:shuffle(opts)};
}
function genFindTwo(L){
  const base=L===1?pick([F(1,2),F(1,3),F(1,4),F(2,3),F(3,4),F(2,5)]):L===2?pick([F(3,8),F(2,5),F(5,6),F(3,10),F(4,5),F(20,100),F(6,8)]):pick([F(5,3),F(9,4),F(7,4),F(5,2),F(5,4),F(11,10)]);
  return{type:'findtwo',skill:'findtwo',base};
}
function genStory(L){
  const D=pick(L===1?[8,12]:[12,8,10]);
  const divs={8:[2,4,8],12:[2,3,4,6,12],10:[2,5,10]}[D];
  let fs,guard=0;
  do{fs=[0,1,2].map(()=>{const d=pick(divs);return F(ri(1,d-1),d)})}
  while(guard++<200&&(new Set(fs.map(f=>f.n*D/f.d)).size<3||new Set(fs.map(f=>f.d)).size<2));
  const ask=(L===3&&Math.random()<.5)?'least':'most';
  const vals=fs.map(f=>f.n/f.d);
  const answer=ask==='most'?vals.indexOf(Math.max(...vals)):vals.indexOf(Math.min(...vals));
  return{type:'story',skill:'story',fs,ask,answer:String(answer)};
}
const GEN={compare:genCompare,benchmark:genBenchmark,missing:genMissing,equiv:genEquiv,findtwo:genFindTwo,story:genStory};

/* ---------- real-world scenes ---------- */
const CTX={

        :{title:'Find 1 whole',prompt:`It’s cut into ${a.d} pieces. How many pieces make 1 whole?`,html:()=>`<div class="srow">${intIn('s-w')}</div>`,
          check:()=>{const v=valN('s-w');if(v!==a.d)return{msg:`If something is cut into ${a.d} pieces, how many pieces is the whole thing?`};ST.strats.push('wholeis');ST.work.push(`1 = ${a.d}/${a.d}`);return{ok:true,sum:`${a.d} pieces make 1 whole.`}}});

        html:()=>`<div class="srow">${a2} <span class="op">${op} ${K} =</span> ${intIn('s-x')}</div>`,
        check:()=>{const v=valN('s-x');if(v!==b2)return{msg:`${a2} ${op} ${K} = ?`};const el=document.getElementById('m');if(el)el.value=b2;return{ok:true,sum:`${a2} ${op} ${K} = ${b2}`}}});
      L.push(final(`${N(1)} needs ${b2}. It’s in ${N(1)}’s card now. Tap “Check my answer.”`));

    case 'equiv':{
      const B=P.base;

        html:()=>P.opts.map((o,i)=>`<div class="srow"><span class="nm">${N(i+1)}</span>${B.d} <span class="op">×</span> ${intIn('s-k'+i)} <span class="op">=</span> ${o.f.d}<button class="schoice none" data-i="${i}" aria-pressed="false">None</button></div>`).join(''),
        wire:box=>box.querySelectorAll('.none').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const inp=document.getElementById('s-k'+b.dataset.i);if(on)inp.value='';inp.disabled=on}),
        check:()=>{ST.K=[];for(let i=0;i<P.opts.length;i++){const o=P.opts[i],K=o.f.d/B.d,none=document.querySelector(`.none[data-i="${i}"]`).getAttribute('aria-pressed')==='true',v=valN('s-k'+i);
          if(Number.isInteger(K)){if(none||v!==K)return{msg:`Check ${N(i+1)}: ${B.d} × ? = ${o.f.d}. Count by ${B.d}s.`};ST.K[i]=K}
          else{if(!none)return{msg:`Check ${N(i+1)}: does ${B.d} × ${v===null?'a number':v} really make ${o.f.d}?`};ST.K[i]=null}}

        html:()=>P.opts.map((o,i)=>ST.K[i]==null?'':`<div class="srow"><span class="nm">${N(i+1)}</span>${B.n} <span class="op">× ${ST.K[i]} =</span> ${intIn('s-t'+i)} <span class="muted" style="font-size:17px">${N(i+1)}’s top is ${o.f.n}</span></div>`).join(''),
        check:()=>{for(let i=0;i<P.opts.length;i++){if(ST.K[i]==null)continue;if(valN('s-t'+i)!==B.n*ST.K[i])return{msg:`Check ${N(i+1)}: ${B.n} × ${ST.K[i]} = ?`}}

        check:()=>{const k=valN('s-k'+idx),t=valN('s-t'+idx),b=valN('s-b'+idx);

function renderSteps(silent){

    if(j<ST.i)return `<li class="step done"><span class="num" aria-label="done">✓</span><div class="sbody"><div class="stt">${s.title}</div><div class="sum">${s.summary||''}</div></div></li>`;

  box.querySelectorAll('.schoice[data-k]').forEach(b=>b.onclick=()=>{const c=cur._choices[+b.dataset.k];if(c.ok)advance(c.sum||c.label,c);else{ST.slips++;b.classList.add('wrong');note(c.why||'Not quite. Try another one.')}});
  const ok=$('#stepok');if(ok)ok.onclick=()=>{const r=cur.check();if(r.ok)advance(r.sum);else{ST.slips++;note(r.msg)}};
  if(cur.wire)cur.wire(box);

    const first=box.querySelector('.step.now input');if(first&&!('ontouchstart' in window))first.focus()}

/* ---------- checking ---------- */
const pairK=(x,y,k)=>(x.n*k===y.n&&x.d*k===y.d)||(y.n*k===x.n&&y.d*k===x.d);
function readFrac(pre){const n=valN(pre+'n'),d=valN(pre+'d');return(n===null||d===null)?null:F(n,d)}

function evaluateAnswer(){
  const r={correct:false,html:'',say:'',her:'',additive:false},c=P.ctx;
  switch(P.type){
    case 'compare':{
      const sym=P.answer,win=sym==='>'?'a':sym==='<'?'b':'same';
      r.correct=ans===win;r.her=ans==='same'?'same amount':N(ans==='a'?0:1);
      const lead=win==='same'?`${N(0)} and ${N(1)} ${c.verb} the same amount!`:`${N(win==='a'?0:1)} ${c.verb} more.`;
      r.html=`<p><b>${lead}</b></p><div class="cmp mid">${fr(P.a,'mid')}<b>${sym}</b>${fr(P.b,'mid')}</div>${commonProof([P.a,P.b],[N(0),N(1)])}${model(rowsFor())}`;
      r.say=`${lead} ${spoken(P.a)} is ${symWord(sym)} ${spoken(P.b)}.`;break}
    case 'benchmark':{
      r.correct=ans===P.answer;r.her=ans;const a=P.a,half=P.t.d===2,t=half?c.half:c.whole;
      const rel=P.answer==='equal'?'equal to':P.answer==='greater'?'more than':'less than';
      const why=half?`Half of ${a.d} is ${a.d/2}. ${N(0)} had ${a.n}, which is ${rel} ${a.d/2}.`:`${a.d} pieces make ${t}. ${N(0)} had ${a.n}, which is ${rel} ${a.d}.`;
      const end=`So ${N(0)} ${c.verb} ${P.answer==='equal'?'exactly':P.answer==='greater'?'more than':'less than'} ${t}.`;
      r.html=`<p><b>${end}</b></p><p>${why}</p>${model(rowsFor(),[{v:half?.5:1,label:half?'½':'1'}])}`;
      r.say=`${end} ${why}`;break}
    case 'missing':{
      const her=valN('m');r.correct=her===P.answer;
      const L=P.left,full=F(P.right.n,P.right.d),m=P.missing;
      r.her=m==='n'?`${her}/${full.d}`:`${full.n}/${her}`;
      const up=full.d>L.d,k=up?full.d/L.d:L.d/full.d,op=up?'×':'÷';
      const first=m==='n'?['bottom',L.d,full.d,'top',L.n,full.n]:['top',L.n,full.n,'bottom',L.d,full.d];
      const why=`The ${first[0]} number went from ${first[1]} to ${first[2]}. That’s ${op} ${k}. Do the same to the ${first[3]}: ${first[4]} ${op} ${k} = ${first[5]}.`;
      const pieces=c.pieces||'pieces';
      const real=up?`${N(1)}’s ${pieces} are smaller. Each of ${N(0)}’s ${pieces} is the same as ${k} of ${N(1)}’s.`:`${N(1)}’s ${pieces} are bigger. ${k} of ${N(0)}’s ${pieces} fit in each one of ${N(1)}’s.`;
      if(m==='n'&&!r.correct&&her!==null&&(her-L.n===full.d-L.d))r.additive=true;
      r.html=`<p><b>${N(1)} needs ${fr(full,'sm')}. The missing number is ${P.answer}.</b></p><p>${real}</p><p>${why}</p>${r.additive?'<p><b>Watch out:</b> adding the same number to the top and bottom changes the size. Multiply or divide both by the same number instead.</p>':''}${model([{f:L,label:N(0)},{f:full,label:N(1),c:1}])}`;
      r.say=`The missing number is ${P.answer}. ${real} ${why}`;break}
    case 'equiv':{
      const okSet=new Set(P.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0));
      r.correct=okSet.size===ans.size&&[...okSet].every(i=>ans.has(i));
      r.her=[...ans].map(i=>`${N(i+1)} ${txt(P.opts[i].f)}`).join(', ');
      r.additive=[...ans].some(i=>P.opts[i].tag==='additive');
      const B=P.base;
      r.html=`<p>${N(0)} ${c.verb} ${fr(B,'sm')}.</p>`+P.opts.map((o,i)=>{
        if(o.ok){const k=o.f.d/B.d;return `<div class="pline"><span class="pn">${N(i+1)}</span>${fr(o.f,'mid')}<span class="ok">Same amount</span><span class="muted">${B.n} × ${k} = ${o.f.n} and ${B.d} × ${k} = ${o.f.d}</span></div>`}
        const why=o.tag==='additive'?'adding the same number to the top and bottom changes the size':'top and bottom were not multiplied by the same number';
        return `<div class="pline"><span class="pn">${N(i+1)}</span>${fr(o.f,'mid')}<span class="no">Different</span><span class="muted">${why}</span></div>`;
      }).join('')+model([{f:B,label:N(0)},...P.opts.map((o,i)=>o.ok?{f:o.f,label:N(i+1),c:1}:null).filter(Boolean)]);
      const same=P.opts.map((o,i)=>o.ok?N(i+1):null).filter(Boolean);
      r.say=`${same.join(' and ')} ${c.verb} the same amount as ${N(0)}.`;break}
    case 'findtwo':{
      const B=P.base,fs=[readFrac('f0'),readFrac('f1')];

      r.correct=good[0]&&good[1]&&distinct;r.her=fs.map(f=>f?txt(f):'?').join(', ');
      r.html=fs.map((f,i)=>{
        const who=`<span class="pn">${N(i+1)}</span>`;
        if(good[i]){const k=f.d/B.d;const how=Number.isInteger(k)?`${B.n} × ${k} = ${f.n} and ${B.d} × ${k} = ${f.d}`:`same amount, you simplified it`;return `<div class="pline">${who}${fr(f,'mid')}<span class="ok">Same amount</span><span class="muted">${how}</span></div>`}
        const add=f&&(f.n-B.n)===(f.d-B.d)&&f.n!==B.n;if(add)r.additive=true;
        const why=txt(f)===txt(B)?`that’s the same fraction as ${N(0)}’s, find a new one`:add?'adding the same number to the top and bottom changes the size':'not the same amount';
        return `<div class="pline">${who}${fr(f,'mid')}<span class="no">Not this one</span><span class="muted">${why}</span></div>`;
      }).join('')+(good[0]&&good[1]&&!distinct?'<p>Both wrote the same fraction. Find two different ones.</p>':'')
        +`<p>Two that work: ${fr(F(B.n*2,B.d*2),'sm')} (cut every piece in 2) and ${fr(F(B.n*3,B.d*3),'sm')} (cut every piece in 3).</p>`
        +model([{f:B,label:N(0)},{f:F(B.n*2,B.d*2),label:'× 2',c:1},{f:F(B.n*3,B.d*3),label:'× 3',c:2}]);
      r.say=r.correct?`Both fractions are the same amount as ${N(0)}’s. Nice.`:`Here are two that work: ${spoken(F(B.n*2,B.d*2))} and ${spoken(F(B.n*3,B.d*3))}.`;break}
    case 'story':{
      r.correct=ans===P.answer;r.her=N(+ans);const w=N(+P.answer);
      const lead=`${w} ${c.verb} the ${P.ask==='most'?'most':'least'}.`;
      r.html=`<p><b>${lead}</b></p>${commonProof(P.fs,P.names)}${model(rowsFor())}`;
      r.say=lead;break}
  }
  return r;
}
function evaluateExplain(){
  if(ST&&ST.full)return{ok:ST.done,notes:ST.done?[]:['Finish the steps first.'],work:ST.work.join('; ')};
  const notes=[];let ok=chosen.size>0;const work=[];
  for(const id of chosen){
    switch(id){
      case 'samebottom':{const fs=commonList();if(!fs.every(f=>f.d===fs[0].d)){ok=false;notes.push('The bottom numbers weren’t the same in this one, so comparing only the tops doesn’t work.')}break}
      case 'sametop':{const fs=commonList();if(!fs.every(f=>f.n===fs[0].n)){ok=false;notes.push('The top numbers weren’t the same in this one.')}break}
      case 'common':{
        const fs=commonList(),ins=fs.map((_,i)=>readFrac('c'+i));
        if(ins.some(f=>!f||f.d<=0)){ok=false;notes.push('Fill in every box under “Made the bottoms match.”');break}
        work.push(fs.map((f,i)=>`${txt(f)}=${txt(ins[i])}`).join(', '));
        if(!ins.every(f=>f.d===ins[0].d)){ok=false;notes.push('In “Made the bottoms match,” all the bottom numbers need to be the same.')}
        fs.forEach((f,i)=>{if(!eq(f,ins[i])){ok=false;notes.push(`${txt(ins[i])} isn’t the same size as ${txt(f)}.`)}});
        break}
      case 'halfof':{const v=valN('w-half');work.push(`half of ${P.a.d} = ${v}`);if(v===null||Math.abs(v-P.a.d/2)>1e-9){ok=false;notes.push(`Half of ${P.a.d} is ${P.a.d/2}.`)}break}
      case 'wholeis':{const v=valN('w-whole');work.push(`1 = ${v}/${P.a.d}`);if(v!==P.a.d){ok=false;notes.push(`1 whole is ${P.a.d}/${P.a.d}.`)}break}
      case 'times':case 'divide':{
        const v=valN(id==='times'?'w-times':'w-div');work.push(`${id==='times'?'×':'÷'} ${v}`);
        let base,targets;
        if(P.type==='missing'){base=P.left;targets=[F(P.right.n,P.right.d)]}
        else if(P.type==='equiv'){base=P.base;targets=[...ans].map(i=>P.opts[i].f)}
        else{base=P.base;targets=[readFrac('f0'),readFrac('f1')].filter(Boolean)}
        if(v===null||!Number.isInteger(v)||v<2||!targets.some(t=>pairK(base,t,v))){ok=false;notes.push(`${id==='times'?'Multiplying':'Dividing'} by ${v===null?'that':v} doesn’t make your fraction. Check which number you used.`)}
        break}
      case 'draw':if(!pad||!pad.hasInk){ok=false;notes.push('Draw your picture in the box.')}break;
    }
  }
  return{ok,notes,work:work.join('; ')};
}
function adapt(skill,correct){
  const r=S.runs[skill]||(S.runs[skill]={up:0,down:0});
  if(correct){r.up++;r.down=0;if(r.up>=2&&S.levels[skill]<3){S.levels[skill]++;r.up=0}}
  else{r.down++;r.up=0;if(r.down>=2&&S.levels[skill]>1){S.levels[skill]--;r.down=0}}
}
function summary(){
  switch(P.type){
    case 'compare':return `${txt(P.a)} vs ${txt(P.b)}`;
    case 'benchmark':return `${txt(P.a)} vs ${P.t.d===2?'1/2':'1'}`;
    case 'missing':return `${txt(P.left)} = ${P.missing==='n'?'?':P.right.n}/${P.missing==='d'?'?':P.right.d}`;
    case 'equiv':return `Same as ${txt(P.base)}? (${P.opts.map(o=>txt(o.f)).join(', ')})`;
    case 'findtwo':return `Two equal to ${txt(P.base)}`;
    case 'story':return `${P.ask==='most'?'Greatest':'Least'} of ${P.fs.map(txt).join(', ')}`;
  }
}

/* ---------- mastery ladder ---------- */
// Learning: full steps. Practicing: shorter steps. Independent: no steps, explain after.
// Mastered: held up on its own, across days and scenes; comes back as spaced review.
const STAGES=['Learning','Practicing','Independent','Mastered'];
const KID_UP=['','You’re ready for shorter steps!','You can do these on your own now!','You mastered it! It’ll come back now and then as a review.'];
const DAY=864e5;
function mst(k){return S.mastery[k]||(S.mastery[k]={stage:0,recent:[],since:Date.now(),reviewDue:null})}
function scaffoldFor(k){if(S.stepMode==='always')return'full';if(S.stepMode==='off')return'none';const st=mst(k).stage;return st===0?'full':st===1?'plan':'none'}
function recordMastery(rec){
  const m=mst(rec.skill),from=m.stage;
  m.recent.push({c:rec.correct?1:0,i:rec.indep?1:0,x:rec.expl?1:0,s:rec.slips||0,ctx:rec.ctx,t:rec.t,st:m.stage});
  if(m.recent.length>12)m.recent=m.recent.slice(-12);
  const at=m.recent.filter(r=>r.st===m.stage),last=n=>at.slice(-n);
  if(m.stage===3){if(rec.review){if(rec.correct)m.reviewDue=rec.t+14*DAY;else m.stage=2}}
  else{
    const l3=at.slice(-3);
    if(m.stage>0&&l3.filter(r=>!r.c).length>=2)m.stage--;
    else if(m.stage===0){const l=last(5);if(l.length===5&&l.filter(r=>r.c).length>=4&&l.reduce((a,r)=>a+r.s,0)<=5)m.stage=1}
    else if(m.stage===1){const l=last(5);if(l.length===5&&l.filter(r=>r.c&&r.x).length>=4)m.stage=2}
    else if(m.stage===2){const l=last(6),ok=l.filter(r=>r.c&&r.x&&r.i);
      if(l.length===6&&ok.length>=5&&new Set(ok.map(r=>new Date(r.t).toDateString())).size>=2&&new Set(ok.map(r=>r.ctx)).size>=2){m.stage=3;m.reviewDue=rec.t+5*DAY}}
  }
  if(m.stage!==from){m.since=rec.t;if(m.stage<3)m.reviewDue=null;
    S.stageLog.push({d:new Date(rec.t).toISOString().slice(0,10),skill:rec.skill,from:STAGES[from],to:STAGES[m.stage]});
    if(S.stageLog.length>300)S.stageLog=S.stageLog.slice(-300)}
  return{from,to:m.stage};
}
function rollup(rec){
  const d=new Date(rec.t).toISOString().slice(0,10),day=S.days[d]||(S.days[d]={});
  const r=day[rec.skill]||(day[rec.skill]={n:0,c:0,ind:0,x:0,sl:0,add:0,h:0});
  r.n++;if(rec.correct)r.c++;if(rec.indep)r.ind++;if(rec.expl)r.x++;r.sl+=rec.slips||0;if(rec.additive)r.add++;if(rec.hint)r.h++;
}
function recentAcc(n){const h=S.history.slice(-n);return h.length?h.filter(x=>x.correct).length/h.length:null}
function planMission(){
  const now=Date.now(),plan=[];
  MISSION.forEach(k=>{const m=mst(k);if(m.stage<3)plan.push({skill:k});else if(m.reviewDue&&now>=m.reviewDue)plan.push({skill:k,review:true})});
  const focus=MISSION.filter(k=>mst(k).stage<3).sort((a,b)=>mst(a).stage-mst(b).stage);
  let fi=0;while(plan.length<6&&focus.length){plan.push({skill:focus[fi%focus.length]});fi++}
  while(plan.length<6)plan.push({skill:pick(MISSION),review:true});
  plan.sort((a,b)=>MISSION.indexOf(a.skill)-MISSION.indexOf(b.skill));
  const acc=recentAcc(10);
  if(acc!==null&&S.history.length>=10&&acc>=0.9){const c=plan.filter(p=>!p.review&&mst(p.skill).stage>=1);(c.length?c[c.length-1]:plan[plan.length-1]).challenge=true}
  return plan.slice(0,6);
}
function seedMastery(){
  if(S.masterySeeded)return;
  S.history.forEach(h=>{const rec={skill:h.skill,correct:h.correct,indep:!h.stepped&&!h.hint,slips:h.slips||0,expl:h.expl,ctx:h.ctx||'?',t:h.t,additive:h.additive,hint:h.hint};if(SKILLS[h.skill]){recordMastery(rec);rollup(rec)}});
  S.masterySeeded=true;save();
}

  <div class="homeside">
  <section class="panel"><h2 class="h3">Practice one thing</h2>
  <div class="pgrid">${Object.keys(SKILLS).map(k=>`<button class="btn" data-skill="${k}">${SKILLS[k].name}</button>`).join('')}</div></section>
  <section class="panel"><h2 class="h3">Your friends <span class="stct">${totalStars()} ★</span></h2>
  <p class="muted fhint">Earn stars to meet new friends. Tap one to say hi.</p>
  <div class="friends">${Object.keys(CAST).map(k=>{const c=CAST[k],open=c.at<=totalStars();return `<button class="friend${open?'':' locked'}" data-friend="${k}">${ch(k,open?'happy':'normal')}${open?c.name.split(' ')[0]:c.at+' ★'}</button>`}).join('')}</div></section>
  </div>
  </div>
  <div class="homefoot">
    <button class="toggle" id="readtoggle" aria-pressed="${S.autoRead}">Read aloud: ${S.autoRead?'on':'off'}</button>
    <button class="hold" id="grownup">Hold for grown-ups</button>
  </div>`;
  $('#start').onclick=()=>startSession('mission',homePlan);
  app.querySelectorAll('[data-friend]').forEach(b=>b.onclick=()=>{const c=CAST[b.dataset.friend];speak(c.at<=totalStars()?'Hi! I am '+c.name+'. '+c.line:'Earn '+c.at+' stars to meet this friend.',true)});
  app.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>startSession('practice',Array(6).fill(b.dataset.skill)));
  $('#readtoggle').onclick=()=>{S.autoRead=!S.autoRead;save();renderHome();if(S.autoRead)speak('Read aloud is on.')};
  const g=$('#grownup');let tmr;
  g.addEventListener('pointerdown',()=>{g.classList.add('holding');tmr=setTimeout(renderGrown,1200)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>g.addEventListener(t,()=>{clearTimeout(tmr);g.classList.remove('holding')}));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();renderGrown()}});
  window.scrollTo(0,0);
}
function renderEnd(){
  app.className='';
  const max=M.skills.length*2,mission=M.kind==='mission';
  const newBest=mission&&M.stars>S.best;
  if(mission){
    S.missions++;if(newBest)S.best=M.stars;
    if(S.lastDay!==dayKey(0)){S.streak=S.lastDay===dayKey(1)?S.streak+1:1;S.lastDay=dayKey(0)}
  }
  save();
  app.innerHTML=`<section>
    <h1 class="title">${mission?'Mission complete':'Practice done'}</h1>
    ${(M.newFriends||[]).length?`<div class="guide">${ch(M.newFriends[M.newFriends.length-1],'cheer','bounce')}<div class="bubble">New friend: ${M.newFriends.map(k=>CAST[k].name).join(' and ')}!</div></div>`:`<div class="guide">${ch(G,'cheer','bounce')}<div class="bubble">${pick(CHEERS)}</div></div>`}
    <p class="bigstars pop">${M.stars}<span>of ${max} stars${M.bonus?` + ${M.bonus} bonus`:''}</span></p>
    ${newBest?'<p><span class="badge">New best</span></p>':(mission&&S.best?`<p class="muted">Your best is ${S.best}. Can you beat it next time?</p>`:'')}
    ${mission?`<p class="record"><b>${S.streak}</b> ${S.streak===1?'day':'days'} in a row.</p>`:''}
    <ol class="checklist trail" aria-label="Mission trail">${M.results.map((r,i)=>`<li class="${r.correct?'ok':'no'}" style="--i:${i}"><span class="mm" aria-hidden="true"><span class="plate">${r.correct?CHECKI:ARROW}${i+1}</span></span>${SKILLS[r.skill].name}<span class="st">${'★'.repeat(r.stars)}</span></li>`).join('')}<li class="fin" style="--i:${M.results.length}"><span class="mm flag" aria-hidden="true"><span class="plate">🏁</span></span>You made it!</li></ol>
    <div class="actions"><button class="btn primary" id="again">${mission?'Another mission':'Practice again'}</button><button class="btn" id="home">Home</button></div>
  </section>`;
  $('#again').onclick=()=>startSession(M.kind,M.kind==='mission'?planMission():M.skills.slice());
  $('#home').onclick=renderHome;
  window.scrollTo(0,0);
  speak(`${mission?'Mission complete!':'Practice done!'} You got ${M.stars} out of ${max} stars.${newBest?' That is a new best!':''}${(M.newFriends||[]).length?' You met a new friend, '+CAST[M.newFriends[M.newFriends.length-1]].name+'!':''}`);
}
function renderGrown(){
  app.className='';
  try{speechSynthesis.cancel()}catch(e){}
  const H=S.history,by={},strat={};let additive=0,hints=0,explFail=0;
  Object.keys(SKILLS).forEach(k=>by[k]={n:0,c:0,e:0});
  let stepped=0,slips=0;H.forEach(h=>{if(h.stepped){stepped++;slips+=h.slips||0}});
  H.forEach(h=>{const b=by[h.skill];if(!b)return;b.n++;if(h.correct)b.c++;if(h.expl)b.e++;(h.strategies||[]).forEach(s=>strat[s]=(strat[s]||0)+1);if(h.additive)additive++;if(h.hint)hints++;if(!h.expl)explFail++});
  const stratTxt=Object.entries(strat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${STRAT_NAMES[k]||k} (${v})`).join(', ');
  const fmt=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  app.innerHTML=`
  <div class="topbar"><h1 class="gtitle">For grown-ups</h1><button class="btn small" id="home">Back to Mio’s screen</button></div>
  <p class="muted">Saved on this iPad only. The latest 60 problems are kept in detail and daily totals are kept for good. ${S.missions} missions done.</p>
  <h2 class="h2">Mastery ladder</h2>
  <p class="muted">The goal is for her to solve each kind of problem on her own and explain why. Steps fade automatically as she moves up, and come back if she struggles.</p>
  <div class="tablewrap"><table class="gt"><thead><tr><th>Skill</th><th>Stage</th><th>Last 10: right / on her own</th><th>To move up</th></tr></thead><tbody>
  ${Object.keys(SKILLS).map(k=>{const m=mst(k),r10=m.recent.slice(-10),c=r10.filter(x=>x.c).length,i=r10.filter(x=>x.c&&x.i).length;
    const next=m.stage===0?'4 of 5 right with full steps':m.stage===1?'4 of 5 right and explained, with shorter steps':m.stage===2?'5 of 6 right on her own, on 2+ days, in 2+ scenes':(m.reviewDue?`Review due ${new Date(m.reviewDue).toLocaleDateString([], {month:'short',day:'numeric'})}`:'Review scheduled');
    return `<tr><td>${SKILLS[k].name}</td><td><span class="stage s${m.stage}">${STAGES[m.stage]}</span></td><td>${r10.length?`${c} / ${i} of ${r10.length}`:'none yet'}</td><td>${next}</td></tr>`}).join('')}
  </tbody></table></div>
  ${(()=>{const L=S.stageLog.slice(-8).reverse();return L.length?`<p><b>Recent moves:</b> ${L.map(x=>`${x.d.slice(5)} ${SKILLS[x.skill].name}: ${x.from} → ${x.to}`).join('; ')}</p>`:''})()}
  <h2 class="h2">Progress over time</h2>
  ${(()=>{const wk={};Object.entries(S.days).forEach(([d,sk])=>{const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()-dt.getDay());const w=dt.toISOString().slice(0,10);const a=wk[w]||(wk[w]={n:0,c:0,ind:0,days:0});a.days++;Object.values(sk).forEach(r=>{a.n+=r.n;a.c+=r.c;a.ind+=r.ind})});
    const rows=Object.entries(wk).sort((a,b)=>b[0]<a[0]?-1:1).slice(0,8);
    return rows.length?`<div class="tablewrap"><table class="gt"><thead><tr><th>Week of</th><th>Days practiced</th><th>Problems</th><th>Right</th><th>On her own</th></tr></thead><tbody>${rows.map(([w,a])=>`<tr><td>${new Date(w+'T12:00:00').toLocaleDateString([], {month:'short',day:'numeric'})}</td><td>${a.days}</td><td>${a.n}</td><td>${Math.round(100*a.c/a.n)}%</td><td>${Math.round(100*a.ind/a.n)}%</td></tr>`).join('')}</tbody></table></div><p class="muted">Aim for about 80% right. Much higher means it’s time for more challenge; much lower means more support.</p>`:'<p class="muted">Weekly totals will show up here after her first mission.</p>'})()}
  <h2 class="h2">By skill</h2>
  <div class="tablewrap"><table class="gt"><thead><tr><th>Skill</th><th>Answer right</th><th>Explanation checked out</th><th>Level now</th></tr></thead><tbody>
  ${Object.keys(SKILLS).map(k=>{const b=by[k];return `<tr><td>${SKILLS[k].name}</td><td>${b.n?`${b.c} of ${b.n}`:'none yet'}</td><td>${b.n?`${b.e} of ${b.n}`:''}</td><td>${S.levels[k]} of 3</td></tr>`}).join('')}
  </tbody></table></div>
  <h2 class="h2">How she explains</h2>
  <p>${stratTxt||'No explanations yet.'}</p>
  <h2 class="h2">Worth watching</h2>
  <ul class="watch">
    <li>Added the same number to the top and bottom: ${additive} ${additive===1?'time':'times'}. This is the mix-up that shows up on her Lesson 8 to 10 worksheets.</li>
    <li>Used “Show me a picture”: ${hints} of ${H.length}.</li>
    <li>Step-by-step: ${stepped} problems, with ${slips} wrong taps she fixed along the way. Repeated slips on the same step show where the structure isn’t clicking yet.</li>
    <li>Explanations that didn’t check out: ${explFail} of ${H.length}.</li>
  </ul>
  <h2 class="h2">Recent work</h2>
  <div class="log">${H.slice(-30).reverse().map(h=>`<div class="entry">
    <div class="top"><span>${h.text}</span><span class="${h.correct?'ok':'no'}">${h.correct?'Right':'Missed'}${h.expl?', explained':''}</span></div>
    <div class="meta">${fmt(h.t)}. ${SKILLS[h.skill]?SKILLS[h.skill].name:''}, level ${h.level}. Her answer: ${h.her||'?'}.${h.hint?' Used bars.':''}</div>
    ${(h.strategies||[]).length?`<div>How: ${h.strategies.map(s=>STRAT_NAMES[s]||s).join(', ')}${h.work?` (${h.work})`:''}</div>`:''}
    ${h.notes&&h.notes.length&&!h.expl?`<div class="meta">${h.notes.join(' ')}</div>`:''}
    ${h.drawing?`<img src="${h.drawing}" alt="Mio’s drawing">`:''}
  </div>`).join('')||'<p class="muted">Nothing yet. Start a mission with Mio.</p>'}</div>
  <h2 class="h2">Weekly report and backup</h2>
  <p class="muted">One code does both. Drop it into the notes folder each week so the weekly update can see her progress, or paste it into another copy to move her stars, friends, and history. Drawings aren’t included.</p>
  <div class="actions"><button class="btn" id="bkup">Copy progress code</button><button class="btn" id="rstr">Restore from a code</button></div>
  <div id="bkbox"></div>
  <h2 class="h2">Read-aloud voice</h2>
  <p class="muted">Voices marked Premium or Enhanced sound far more natural. If you don’t see one, download it on the iPad: Settings, Accessibility, Spoken Content, Voices, English, then tap a voice like Ava, Zoe, or Samantha and download the Premium or Enhanced version. Then close and reopen this app.</p>
  ${canSpeak()?`<div class="srow"><select id="voicesel" class="numin" style="width:auto;min-width:240px;font-size:18px;padding:8px 10px;text-align:left">${englishVoices().map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}"${sayVoice&&v.name===sayVoice.name?' selected':''}>${v.name} (${v.lang})</option>`).join('')||'<option>No voices found yet</option>'}</select><button class="btn small" id="voicetest">Try it</button></div>
  <div class="srow" style="font-size:18px">Speed ${[['.8','Slower'],['.92','Normal'],['1.05','Faster']].map(([r,l])=>`<button class="schoice" data-rate="${r}" aria-pressed="${String(S.rate||.92)===r||(!S.rate&&r==='.92')}">${l}</button>`).join('')}</div>`:'<p>Read-aloud isn’t available in this browser.</p>'}
  <h2 class="h2">Settings</h2><p class="muted">Step-by-step help. <b>By skill</b> (recommended) fades the steps as she moves up the mastery ladder. <b>Always</b> shows full steps on every problem. <b>Off</b> has her plan on her own and explain afterward.</p>
  <div class="srow" style="font-size:18px">${[['auto','By skill'],['always','Always'],['off','Off']].map(([v,l])=>`<button class="schoice" data-mode="${v}" aria-pressed="${S.stepMode===v}">${l}</button>`).join('')}</div>
  <div class="actions"><button class="btn" id="reset">Erase all progress</button></div>`;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.stepMode=b.dataset.mode;S.steps=S.stepMode!=='off';save();renderGrown()});
  $('#bkup').onclick=async()=>{
    const data=Object.assign({},S,{history:S.history.map(h=>Object.assign({},h,{drawing:null}))});
    const code='FL1:'+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    let copied=false;try{await navigator.clipboard.writeText(code);copied=true}catch(e){}
    $('#bkbox').innerHTML=`<p>${copied?'Copied. ':''}Save this code somewhere safe, like the Notes app. On the new copy, open this page and tap “Restore from a code.”</p><textarea class="bk" readonly aria-label="Backup code">${code}</textarea>`;
    const t=$('#bkbox textarea');t.focus();t.select();
  };
  $('#rstr').onclick=()=>{
    $('#bkbox').innerHTML=`<p>Paste the backup code, then tap Restore. This replaces the progress on this iPad.</p><textarea class="bk" id="bkin" aria-label="Paste backup code"></textarea><div class="actions"><button class="btn primary" id="bkgo">Restore</button></div>`;
    $('#bkgo').onclick=()=>{
      try{const raw=$('#bkin').value.trim().replace(/^FL1:/,'');const o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||!o.levels)throw 0;
        const s=freshState();Object.assign(s,o);s.levels=Object.assign(freshState().levels,o.levels);S=s;save();pickVoice();renderGrown();
        const b=$('#bkbox');if(b)b.innerHTML='<p class="ok">Progress restored.</p>';}
      catch(e){$('#bkbox').insertAdjacentHTML('beforeend','<p class="no">That code didn’t work. Make sure you copied all of it.</p>')}
    };
  };
  const vsel=$('#voicesel');
  if(vsel){vsel.onchange=()=>{S.voiceName=vsel.value;save();pickVoice();speak('Hi Mio! Let’s break it down.',true)};
    $('#voicetest').onclick=()=>speak('Hi Mio! Kelp ate three eighths of a pizza. Mochi ate two sixths. Who ate more?',true);
    app.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{S.rate=parseFloat(b.dataset.rate);save();app.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',x===b));speak('This is how fast I will read.',true)});}
  $('#home').onclick=renderHome;
  const rb=$('#reset');let armed=false;
  rb.onclick=()=>{if(armed){const keep=S.autoRead;S=freshState();S.autoRead=keep;save();renderGrown();return}armed=true;rb.textContent='Tap again to erase everything';setTimeout(()=>{armed=false;if(rb.isConnected)rb.textContent='Erase all progress'},3000)};
  window.scrollTo(0,0);
}

seedMastery();
renderHome();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
